name: Deploy

# CD chay TRUC TIEP tren VPS (self-hosted runner wibu-vps) — khong can SSH nguoc.
# Server da chuan bi: php8.3-fpm pool wibu (:9000), postgres container,
# host nginx vhosts, pm2 wibu-admin, wibu-queue.service.
# Chay khi push main (code 3 services) hoac bam tay.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-admin/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, wibu-vps]
    env:
      FRONTEND_PUBLIC_API_URL: ${{ secrets.FRONTEND_PUBLIC_API_URL }}
      ADMIN_PUBLIC_API_URL: ${{ secrets.ADMIN_PUBLIC_API_URL }}
    steps:
      - name: Sync code
        run: |
          set -e
          cd /opt/wibu-store
          git pull origin main
          git rev-parse --short HEAD

      - name: Backend
        run: |
          set -e
          cd /opt/wibu-store/backend
          php8.3 "$(command -v composer)" install --no-interaction --prefer-dist --optimize-autoloader
          php8.3 artisan migrate --force

      - name: Storefront build
        run: |
          set -e
          cd /opt/wibu-store/frontend
          pnpm install --frozen-lockfile
          PUBLIC_API_URL="$FRONTEND_PUBLIC_API_URL" pnpm build

      - name: Admin build + reload
        run: |
          set -e
          cd /opt/wibu-store/frontend-admin
          pnpm install --frozen-lockfile
          PUBLIC_API_URL="$ADMIN_PUBLIC_API_URL" pnpm build
          # pm2 daemon chay duoi root (ghrunner goi qua sudo, HOME=/root giu nguyen)
          sudo -n pm2 restart wibu-admin --update-env || sudo -n PORT=4322 HOST=0.0.0.0 PUBLIC_API_URL="$ADMIN_PUBLIC_API_URL" pm2 start ./dist/server/entry.mjs --name wibu-admin
          sudo -n pm2 save

      - name: Services reload
        run: |
          set -e
          sudo -n systemctl restart wibu-queue
          sudo -n nginx -t && sudo -n systemctl reload nginx
          sudo -n systemctl restart php8.3-fpm

      - name: Smoke test
        run: |
          set -e
          curl -fsS -o /dev/null -H "Host: wibu-store.jadt.io.vn" http://127.0.0.1/
          curl -fsS -H "Host: wibu-store.jadt.io.vn" http://127.0.0.1/api/v1/health
          echo
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: admin-wibu-store.jadt.io.vn" http://127.0.0.1/)
          test "$code" = "302" && echo "admin OK ($code)"
