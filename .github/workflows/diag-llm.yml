name: Diag LLM

# Chan doan nhanh duong backend -> 9router tren VPS (khong in secret).
# Actions > Diag LLM > Run workflow > xem log.

on:
  workflow_dispatch:

jobs:
  diag:
    name: Probe 9router from VPS
    runs-on: [self-hosted, wibu-vps]
    steps:
      - name: Probe
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          BASE=$(grep -E '^LLM_BASE_URL=' "$ENV" | cut -d= -f2- | tr -d "\"'\r")
          HOST=$(echo "$BASE" | sed -E 's#(https?://[^/]+).*#\1#')
          echo "LLM host: $HOST"
          echo "has key: $(grep -E '^LLM_API_KEY=.{4,}' "$ENV" >/dev/null && echo yes || echo no)"
          echo "chat model: $(grep -E '^LLM_CHAT_MODEL=' "$ENV" | cut -d= -f2- | tr -d "\"'\r")"
          time curl -s -o /dev/null -w "models (no auth): %{http_code} %{time_total}s\n" --max-time 20 "$BASE/models" || true
      - name: Env bytes inspect (no secrets printed)
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          echo "LLM_BASE_URL occurrences: $(grep -c -E '^LLM_BASE_URL=' "$ENV")"
          grep -E '^LLM_(BASE_URL|CHAT_MODEL|TIMEOUT_SECONDS|CONNECT_TIMEOUT)=' "$ENV" | cat -A
      - name: Auth chat probe (5 tokens)
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          get() { grep -E "^$1=" "$ENV" | cut -d= -f2- | tr -d "\"'\r"; }
          BASE=$(get LLM_BASE_URL)
          KEY=$(get LLM_API_KEY)
          MODEL=$(get LLM_CHAT_MODEL)
          if [ -z "$KEY" ]; then echo "SKIP: no LLM_API_KEY"; exit 0; fi
          time curl -s -o /tmp/llmprobe.json -w "chat: %{http_code} %{time_total}s\n" --max-time 60 \
            -X POST "$BASE/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $KEY" \
            -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}" || true
          head -c 300 /tmp/llmprobe.json 2>/dev/null || true; echo
      - name: Laravel log (LlmService)
        run: |
          LOG=/opt/wibu-store/backend/storage/logs/laravel.log
          [ -f "$LOG" ] || { echo "no laravel.log"; exit 0; }
          grep -a 'LlmService' "$LOG" | tail -8 || echo "no LlmService lines"
      - name: PHP-side timing probe (tinker, one-liner)
        run: |
          set -e
          cd /opt/wibu-store/backend
          timeout 90 php8.3 artisan tinker --execute='$t=microtime(true); try { $r=App\Domain\Ai\LlmService::generate("hi"); echo "OK model=".$r["model"]; } catch (\Throwable $e) { echo get_class($e).": ".substr($e->getMessage(),0,120); } echo " elapsed=".round(microtime(true)-$t,2)."s";' 2>&1 | tail -4 || true
      - name: Probe IPv4 loopback explicitly + hosts file
        run: |
          set -e
          echo "--- /etc/hosts:"; cat /etc/hosts
          echo "--- direct 127.0.0.1:20128:"
          time curl -s -o /dev/null -w "v4 models: %{http_code} connect=%{time_connect}s total=%{time_total}s\n" --max-time 15 http://127.0.0.1:20128/v1/models || true
      - name: Probe candidate models (5 tokens each)
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          BASE=$(grep -E '^LLM_BASE_URL=' "$ENV" | cut -d= -f2- | tr -d "\"'\r")
          curl -s --max-time 15 "$BASE/models" -o /tmp/models.json || true
          grep -o '"id":"[^"]*"' /tmp/models.json | sort -u | head -100; echo
      - name: Timed probe per candidate model
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          get() { grep -E "^$1=" "$ENV" | cut -d= -f2- | tr -d "\"'\r"; }
          BASE=$(get LLM_BASE_URL); KEY=$(get LLM_API_KEY)
          for M in "ag/gemini-3-flash" "af/gpt-oss-20b" "bzl/gpt-5.4-nano"; do
            time curl -s -o /tmp/probe.json -w "chat [$M]: %{http_code} total=%{time_total}s\n" --max-time 25 -X POST "$BASE/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}" || true
            head -c 200 /tmp/probe.json 2>/dev/null; echo
          done
          time curl -s -o /tmp/imgprobe.json -w "image [gemini-3.1-flash-image]: %{http_code} total=%{time_total}s\n" --max-time 45 -X POST "$BASE/images/generations" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -d '{"model":"ag/gemini-3.1-flash-image","prompt":"red apple"}' || true
          head -c 200 /tmp/imgprobe.json; echo
