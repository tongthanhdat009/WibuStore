name: Diag LLM

# Chan doan nhanh duong backend -> 9router tren VPS (khong in secret).
# Actions > Diag LLM > Run workflow > xem log.

on:
  workflow_dispatch:

jobs:
  diag:
    name: Probe 9router from VPS
    runs-on: [self-hosted, wibu-vps]
    steps:
      - name: Probe
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          BASE=$(grep -E '^LLM_BASE_URL=' "$ENV" | cut -d= -f2- | tr -d "\"'\r")
          HOST=$(echo "$BASE" | sed -E 's#(https?://[^/]+).*#\1#')
          echo "LLM host: $HOST"
          echo "has key: $(grep -E '^LLM_API_KEY=.{4,}' "$ENV" >/dev/null && echo yes || echo no)"
          echo "chat model: $(grep -E '^LLM_CHAT_MODEL=' "$ENV" | cut -d= -f2- | tr -d "\"'\r")"
          time curl -s -o /dev/null -w "models (no auth): %{http_code} %{time_total}s\n" --max-time 20 "$BASE/models" || true
      - name: Env bytes inspect (no secrets printed)
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          echo "LLM_BASE_URL occurrences: $(grep -c -E '^LLM_BASE_URL=' "$ENV")"
          grep -E '^LLM_(BASE_URL|CHAT_MODEL|IMAGE_MODEL|VISION_MODEL|TIMEOUT_SECONDS|CONNECT_TIMEOUT)=' "$ENV" | cat -A
      - name: Probe candidate models (5 tokens each)
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          BASE=$(grep -E '^LLM_BASE_URL=' "$ENV" | cut -d= -f2- | tr -d "\"'\r")
          curl -s --max-time 15 "$BASE/models" -o /tmp/models.json || true
          grep -o '"id":"[^"]*"' /tmp/models.json | sort -u | head -100; echo
      - name: Timed probe per candidate model
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          get() { grep -E "^$1=" "$ENV" | cut -d= -f2- | tr -d "\"'\r"; }
          BASE=$(get LLM_BASE_URL); KEY=$(get LLM_API_KEY)
          probe_chat() {
            time curl -s -o /tmp/probe.json -w "chat [$1]: %{http_code} total=%{time_total}s\n" --max-time 30 -X POST "$BASE/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -d "{\"model\":\"$1\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}" || true
            head -c 200 /tmp/probe.json 2>/dev/null || true; echo; sleep 3
          }
          probe_chat "af/gpt-oss-20b"
          probe_chat "bzl/gemini-3-flash-preview"
          probe_chat "cf/@cf/mistralai/mistral-small-3.1-24b-instruct"
          echo "--- vision probe (1px png) on bzl/gemini-3-flash-preview:"
          time curl -s -o /tmp/vprobe.json -w "vision: %{http_code} total=%{time_total}s\n" --max-time 30 -X POST "$BASE/chat/completions" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -d '{"model":"bzl/gemini-3-flash-preview","messages":[{"role":"user","content":[{"type":"text","text":"mo ta anh nay"},{"type":"image_url","image_url":{"url":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="}}]}],,"max_tokens":5}' || true
          head -c 300 /tmp/vprobe.json 2>/dev/null; echo
          echo "--- image gen probe (cf SDXL fallback):"
          time curl -s -o /tmp/imgprobe2.json -w "image [cf sdxl]: %{http_code} total=%{time_total}s\n" --max-time 60 -X POST "$BASE/images/generations" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -d '{"model":"cf/@cf/bytedance/stable-diffusion-xl-lightning","prompt":"red apple"}' || true
          head -c 200 /tmp/imgprobe2.json 2>/dev/null; echo
      - name: Laravel log (LlmService)
        run: |
          LOG=/opt/wibu-store/backend/storage/logs/laravel.log
          [ -f "$LOG" ] || { echo "no laravel.log"; exit 0; }
          grep -a 'LlmService' "$LOG" | tail -8 || echo "no LlmService lines"
      - name: 9router process inspect (no secrets)
        run: |
          (docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null | head -20 || echo "no docker or no access") || true
          (ss -ltnp 2>/dev/null | grep -E ':20128' || echo "no ss match") || true
      - name: Probe embedding support (for visual search)
        run: |
          set -e
          ENV=/opt/wibu-store/backend/.env
          get() { grep -E "^$1=" "$ENV" | cut -d= -f2- | tr -d "\"'\r"; }
          BASE=$(get LLM_BASE_URL); KEY=$(get LLM_API_KEY)
          curl -s --max-time 15 "$BASE/models" -o /tmp/allmodels.json || true
          echo "--- models matching embed/vision/multimodal/clip/jina/cohere:"
          grep -o '"id":"[^"]*"' /tmp/allmodels.json | sort -u | grep -iE 'embed|vision|multimodal|clip|jina|cohere|vl-|vqa' || echo "(none)"
          echo "--- text embeddings probe (cf bge):"
          time curl -s -o /tmp/emb.json -w "embed: %{http_code} total=%{time_total}s\n" --max-time 30 -X POST "$BASE/embeddings" -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -d '{"model":"cf/@cf/baai/bge-base-en-v1.5","input":"Son Goku action figure"}' || true
          head -c 300 /tmp/emb.json 2>/dev/null; echo
