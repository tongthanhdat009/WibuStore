# WibuStore: TLS terminate tai Cloudflare edge (tunnel -> :80 http).
# KHONG redirect :80 -> https o day (tunnel da nhan http tu localhost).

# ---------- Customer storefront ----------
server {
    listen 80;
    server_name wibu-store.jadt.io.vn;

    root /opt/wibu-store/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    access_log /var/log/nginx/wibu-store-access.log;
    error_log /var/log/nginx/wibu-store-error.log;

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /opt/wibu-store/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /sanctum/ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /opt/wibu-store/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# ---------- Admin SSR ----------
server {
    listen 80;
    server_name admin-wibu-store.jadt.io.vn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    access_log /var/log/nginx/wibu-store-admin-access.log;
    error_log /var/log/nginx/wibu-store-admin-error.log;

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /opt/wibu-store/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /sanctum/ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /opt/wibu-store/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
