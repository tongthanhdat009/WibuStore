# Optional services cho Wibu Store dev (Postgres dung chung container san co).
# API + 2 Astro frontends chay host-native qua Makefile.
# Chay: docker compose -f infra/compose.yaml up -d   ( them --profile redis neu can )
name: wibu-store

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Console (dev only)
    environment:
      MINIO_ROOT_USER: local_minio_access_key
      MINIO_ROOT_PASSWORD: local_minio_secret_key
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["redis"] # MVP dung database driver; bat khi can scale (CACHE_STORE/QUEUE_CONNECTION=redis)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

volumes:
  minio-data:
